<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2410c">
<title>GAME NAME (nouvelle version) - LehcimGames</title>
<link rel="stylesheet" href="../../common/nouveau.css">
</head>
<body>
<header class="nv-top">
  <a class="back" href="../../index.html#GAMEID">← <span>Accueil</span></a>
  <h1>GAME NAME</h1>
  <span class="badge">Nouvelle version</span>
  <span class="grow"></span>
  <div class="actions">
    <button class="btn primary" id="new">Nouvelle partie</button>
    <button class="btn icon ghost" data-help title="Règles" aria-label="Règles">?</button>
    <button class="btn icon ghost" id="settingsBtn" title="Réglages" aria-label="Réglages">⚙</button>
    <button class="btn icon ghost" data-mute title="Son" aria-label="Son"></button>
  </div>
</header>

<main class="nv-main">
  <div class="nv-stage" id="stage">
    <canvas id="game" width="640" height="480"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </div>
  <aside class="nv-side">
    <section class="card"><div class="status" id="status"></div><div class="sub" id="substatus"></div></section>
    <!-- score / stats / quick options / controls cards -->
  </aside>
</main>

<footer class="nv-foot">
  <a href="../">Version d'origine</a>
  <a href="../algorithme.html">L'algorithme</a>
  <a href="../../index.html">Tous les jeux</a>
</footer>

<dialog id="help"><div class="d-head"><h2>Règles du jeu</h2><button class="btn icon ghost" onclick="this.closest('dialog').close()" aria-label="Fermer">✕</button></div>
  <div class="d-body"><!-- rules in French --></div>
  <div class="d-foot"><button class="btn primary" onclick="this.closest('dialog').close()">J'ai compris</button></div></dialog>

<dialog id="settings"><div class="d-head"><h2>Réglages</h2><button class="btn icon ghost" onclick="this.closest('dialog').close()" aria-label="Fermer">✕</button></div>
  <div class="d-body"><!-- level, mode, who starts, music... --></div>
  <div class="d-foot"><button class="btn primary" onclick="this.closest('dialog').close()">OK</button></div></dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="../../common/lehcim.js"></script>
<script src="game.js"></script>
</body>
</html>
